services:
  otoroshi:
    image: maif/otoroshi:16.19.0
    ports:
      - "8080:8080"
    environment:
      - JDK_JAVA_OPTIONS='-Dconfig.file=/usr/app/otoroshi/conf/oto.conf'
    volumes:
      - ./conf:/usr/app/otoroshi/conf
      - ./filedb:/usr/app/filedb
    networks:
      othoroshi_default:
        aliases:
          - testjsonplateforme
        driver_opts:
          com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  httpbin:
    image: kennethreitz/httpbin
    networks:
      othoroshi_default:
        aliases:
          - testjsonplateforme
  elasticsearch:
    image: elasticsearch:7.8.1
    ports:
      - 9200:9200
    environment:
      discovery.type: 'single-node'
      xpack.security.enabled: 'true'
      ELASTIC_PASSWORD: 'P@ssw0rd'
      ES_JAVA_OPTS: '-Xmx2g -Xms2g'
    networks:
      othoroshi_default:
        aliases:
          - testjsonplateforme
  kibana:
    image: kibana:7.8.1
    volumes:
      - ./conf/kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - 5601:5601
    networks:
      othoroshi_default:
        aliases:
          - testjsonplateforme    

  # db:
  #   image: postgres
  #   restart: always
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - 5432:5432
  #   networks:
  #     othoroshi_default:
  
  daikoku:
    image: maif/daikoku:latest
    ports:
      - "8180:8080"
    networks:
      othoroshi_default:

networks:
  othoroshi_default: